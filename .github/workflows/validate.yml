name: Repository validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysis dependency
        run: python3 -m pip install --disable-pip-version-check -r requirements-analysis.txt

      - name: Validate manifests and source files
        run: python3 scripts/validate-repository.py

      - name: Check shell syntax
        run: bash -n scripts/build.sh

      - name: Smoke-test portable commands
        run: |
          python3 scripts/prepare-source.py --help >/dev/null
          python3 benchmarks/run-prefill.py --help >/dev/null
          python3 benchmarks/analyze-profile.py --help >/dev/null
          python3 benchmarks/analyze-experts.py --help >/dev/null
          python3 benchmarks/analyze-perplexity.py --help >/dev/null
          python3 benchmarks/compare-numerics.py --help >/dev/null
          python3 scripts/download-models.py --help >/dev/null
          python3 scripts/render-service.py --help >/dev/null
          python3 scripts/render-service.py >/dev/null
          python3 benchmarks/profile-continuation.py --help >/dev/null
          python3 benchmarks/analyze-continuation.py --help >/dev/null
          python3 benchmarks/diagnostics/rgp/run-counters.py --help >/dev/null
          python3 benchmarks/diagnostics/rgp/run-counters.py --probe /tmp/probe --shim /tmp/shim.so --backend-dir /tmp/bin --output /tmp/captures --dry-run >/dev/null
          python3 benchmarks/diagnostics/rgp/analyze-rgp.py --help >/dev/null
          python3 scripts/serve.py --profile stable --dry-run >/dev/null
          python3 scripts/serve.py --dry-run >/dev/null
          python3 scripts/serve.py --optimized-prefill --dry-run >/dev/null
          python3 scripts/serve.py --expert-prefill --dry-run >/dev/null
          python3 ops/restore-francis-baseline.py --bind-host 127.0.0.1 --dry-run >/dev/null

  reconstruct:
    name: Reconstruct ${{ matrix.profile }} profile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [stable, profile, mr, moe-tiles, prefill-next, prefill-stage2]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconstruct and verify patched source
        run: >-
          python3 scripts/prepare-source.py
          --profile "${{ matrix.profile }}"
          --destination "$RUNNER_TEMP/source-${{ matrix.profile }}"
